<!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar-small">{{ user.first_name|first|upper }}</div>
                <span class="sidebar-username">{{ user.first_name }}</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span class="nav-text">Profile</span>
                </a>
                <a href="{% url 'dashboard' %}" class="nav-item{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Overview</span>
                </a>
                <a href="{% url 'browse_jobs' %}" class="nav-item{% if request.resolver_match.url_name == 'browse_jobs' %} active{% endif %}">
                    <i class="fas fa-search"></i>
                    <span class="nav-text">Browse Jobs</span>
                </a>
                <a href="{% url 'my_proposals' %}" class="nav-item{% if request.resolver_match.url_name == 'my_proposals' %} active{% endif %}">
                    <i class="fas fa-paper-plane"></i>
                    <span class="nav-text">My Proposals</span>
                </a>
                <a href="{% url 'active_jobs' %}" class="nav-item{% if request.resolver_match.url_name == 'active_jobs' %} active{% endif %}">
                    <i class="fas fa-tasks"></i>
                    <span class="nav-text">Active Jobs</span>
                </a>
                <a href="{% url 'earnings' %}" class="nav-item{% if request.resolver_match.url_name == 'earnings' %} active{% endif %}">
                    <i class="fas fa-dollar-sign"></i>
                    <span class="nav-text">Earnings</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-envelope"></i>
                    <span class="nav-text">Messages</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span class="nav-text">Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="{% url 'logout' %}" class="nav-item logout-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="nav-text">Logout</span>
                </a>
            </div>
        </aside>
