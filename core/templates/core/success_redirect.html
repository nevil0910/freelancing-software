{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - {{ APP_NAME }}</title>
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
    <style>
        .success-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .success-title {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .countdown-text {
            font-size: 1.2rem;
            color: #c7d2fe;
            margin-top: 20px;
        }
        
        .countdown-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #8b5cf6;
            display: inline-block;
            margin: 0 10px;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="background-gradient"></div>
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        
        <div class="auth-wrapper">
            <div class="auth-card" style="text-align: center;">
                <div class="success-icon">✅</div>
                <h1 class="success-title" style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    {{ title }}
                </h1>
                <p style="color: #a5b4fc; font-size: 1.1rem;">{{ message }}</p>
                
                <div class="countdown-text">
                    Redirecting to login in <span class="countdown-number" id="countdown">3</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
</body>
</html>
