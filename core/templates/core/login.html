{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ APP_NAME }}</title>
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="background-gradient"></div>
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Log in to {{ APP_NAME }}</p>
                </div>

                {% if error %}
                <div class="error-message">
                    <span class="error-icon">⚠️</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" class="auth-form" autocomplete="off">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter your username or email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                                <i class="fa-solid fa-eye-slash" id="eyeSlashIcon" style="display:none;"></i>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-password-link">
                        <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Log In</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="{% url 'signup' %}" class="auth-link">Sign Up</a></p>
                    <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'core/js/auth.js' %}"></script>
    <script>
        // Prevent back navigation after login
        (function() {
            if (window.history && window.history.pushState) {
                window.history.pushState('forward', null, '');
                window.addEventListener('popstate', function() {
                    window.history.pushState('forward', null, '');
                });
            }
        })();
    </script>
</body>
</html>
