{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - {{ APP_NAME }}</title>
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="background-gradient"></div>
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Forgot Password?</h1>
                    <p class="auth-subtitle">Enter your email to receive an OTP</p>
                </div>

                {% if error %}
                <div class="error-message">
                    <span class="error-icon">⚠️</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                {% if success %}
                <div class="error-message" style="background: #22c55e20; border-color: #22c55e40; color: #86efac;">
                    <span class="error-icon">✓</span>
                    <span>{{ success }}</span>
                </div>
                {% endif %}

                <form method="POST" class="auth-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your registered email"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Send OTP</button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <a href="{% url 'login' %}" class="auth-link">Log In</a></p>
                    <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'core/js/auth.js' %}"></script>
    <script>
        // Prevent back navigation
        (function() {
            if (window.history && window.history.pushState) {
                window.history.pushState('forward', null, '');
                window.addEventListener('popstate', function() {
                    window.history.pushState('forward', null, '');
                });
            }
        })();
    </script>
</body>
</html>
